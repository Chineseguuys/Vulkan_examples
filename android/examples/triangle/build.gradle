apply plugin: 'com.android.application'
apply from: '../gradle/outputfilename.gradle'

android {
    // AGP 8 requires the namespace to be declared here (the manifest's package attribute is no longer supported)
    // If the root build.gradle injects a namespace via afterEvaluate, it only applies when this is unset
    namespace "de.saschawillems.vulkanTriangle"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.saschawillems.vulkanTriangle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters rootProject.ext.abiFilters
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", '-DANDROID_TOOLCHAIN=clang', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    sourceSets {
        main.assets.srcDirs = ['assets']
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

task copyTask {
    copy {
        from '../../common/res/drawable'
        into "src/main/res/drawable"
        include 'icon.png'
    }

    copy {
        from rootProject.ext.shaderPath + 'glsl/base'
        into 'assets/shaders/glsl/base'
        include '*.spv'
    }

    copy {
       from rootProject.ext.shaderPath + 'glsl/triangle'
       into 'assets/shaders/glsl/triangle'
       include '*.*'
    }

    copy {
        from rootProject.ext.assetPath + 'Roboto-Medium.ttf'
        into 'assets'
    }


}

preBuild.dependsOn copyTask